# Car B: steering measured 2026-10-16, motor 2026-10-19. See
# car_a/autosdv_vehicle/actuator.param.yaml for what this file is. Select with
# the launch argument vehicle_id:=car_b.
/**:
  ros__parameters:
    ## Motor, measured 2026-10-19 (keyboard_pwm_control, 5-count steps;
    # docs/design/esc-pwm-model.md). Still at 385 and 390; forward starts at
    # 395. Reverse: pull to 355, back to 385, then 380 and below drives
    # backward; 385 does not move; 395 disarms (and drives forward). So the
    # stop sits in 385..390 (390 here: 5 counts from forward, 10 from armed
    # reverse), and the stopping brake must stay above 355 or every stop
    # arms reverse.
    init_pwm: 390
    # Provisional: above the arming point 355 and below the stop; that it
    # brakes without arming is not tested yet.
    brake_pwm: 365
    forward_start_pwm: 395
    reverse_stop_pwm: 385
    reverse_start_pwm: 380
    reverse_arm_pwm: 355
    # forward_hold_pwm: not measured

    ## Steering: centre 400. Higher PWM = RIGHT turn on this car, lower = LEFT
    # (Lab 2 run lab2_uturn_3, 2026-10-27: a right command drove 445 and the
    # car turned right). Ends measured 2026-10-27 on a stand with
    # keyboard_pwm_control: the wheels reach the joystick's lock at 330 and
    # 470 (-70/+70 counts); 355..445 before, which could not make the
    # lab2_uturn's 1.1 m radius.
    init_steer: 400
    min_steer: 330
    max_steer: 470

    # 205 counts/rad, from lab2_uturn_3: held at +45 counts (445) the car drove
    # R = 1.43 m (circle fit to 89 marker fixes, 8 mm residual; the gyro gives
    # 1.39 m), so atan(0.319 / 1.43) = 0.22 rad and 45 / 0.22 = 205. Negative:
    # a right (negative) tire angle needs a higher PWM. With it, max_steer_angle
    # (0.349 rad) asks for 72 counts, so the ends above bind just before it.
    # One point, not a steer-fit: replace it with `just lab2 steer-fit`'s result.
    # Was -132, from a rough full-lock radius of 0.90 m that the car did not drive.
    tire_angle_to_steer_ratio: -205.0
