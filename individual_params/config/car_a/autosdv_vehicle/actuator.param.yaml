# Car A, the Velodyne car. Motor measured 2026-10-19 (keyboard_pwm_control,
# 5-count steps); steering ends measured 2026-10-27 (centre 489, +-95). The simulators no longer use this car: they have their own
# instance, sim, which is actuator.yaml's values.
#
# config/<vehicle_id>/autosdv_vehicle/actuator.param.yaml holds what differs
# between physical copies of the AutoSDV vehicle -- the ESC's neutral and brake
# points, the steering servo's centre and ends, a measured steering ratio (only
# once measured) -- and nothing else. vehicle_interface.launch.xml takes
# vehicle_id:=<id> (required; the actuator refuses to start without one) and
# loads this file last, after actuator.yaml and any per-launch
# actuator_param_overrides, so a measured value wins over a lab's stand-in.
/**:
  ros__parameters:
    ## Motor, measured 2026-10-19 (docs/design/esc-pwm-model.md). Still at 380;
    # forward starts at 385. Reverse: pull to 345, back to 370, then 365 and
    # below drives backward; once reversing, 370 keeps it going and 375 stops
    # it; 385 disarms. So the stop is 380, the middle of 375..385, and the
    # stopping brake must stay above 345 or every stop arms reverse.
    init_pwm: 380
    # Provisional: above the arming point 345 and below the stop; that it
    # brakes without arming is not tested yet.
    brake_pwm: 360
    forward_start_pwm: 385
    reverse_stop_pwm: 375
    reverse_start_pwm: 365
    reverse_arm_pwm: 345
    # forward_hold_pwm: not measured

    ## Steering: centre 489, full lock +-95 counts, measured 2026-10-27 (was
    # actuator.yaml's +-50, which left about half the lock unused). Higher PWM
    # (584) = RIGHT turn, lower PWM (394) = LEFT turn: in lab2_uturn_2 a right
    # command raised the PWM and the car turned right (as on car B).
    init_steer: 489
    min_steer: 394
    max_steer: 584

    # Steering ratio, measured from lab2_uturn_2 (2026-10-27): with Lab 2's
    # stand-in -143 the tracker sat at max_steer_angle (0.349 rad = 50 counts,
    # PWM 539) through the turn, and a circle fitted to the marker fixes there
    # gives R 1.49 m (rms 1.7 cm), so 50 / atan(0.319 / 1.49) = 237. The gyro's
    # yaw rate, with the wheel speed corrected for car A's 2.1x over-read, gives
    # R 1.6 m (254). One circle only: refine with `just lab2 steer-fit` (three
    # or more). At 0.349 rad this reaches 83 of the 95 counts.
    tire_angle_to_steer_ratio: -237.0
