# Configuration Settings for C94-F9P device in Rover Mode
/**:
  ros__parameters:
    debug: 0                    # Range 0-4 (0 means no debug statements will print)
    device: /dev/ublox-gps
    frame_id: gps
    uart1:
      baudrate: 9600
    # TMODE3 Config - Rover mode (disabled)
    tmode3: 0                   # Disabled for rover (base station uses survey-in)

    inf:
      all: true                 # Whether to display all INF messages in console

    publish:
      all: true
      aid:
        hui: false
      nav:
        posecef: false
