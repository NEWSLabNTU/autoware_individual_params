sensor_kit_base_link:
  vlp32c: # Velodyne VLP-32C LiDAR
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  imu_link:
    x: 0.000000
    y: 0.000000
    z: -0.055
    roll: 0.000000
    pitch: 0.00000
    yaw: 0.000000
  gnss_base_link:
    x: 0.000000
    y: 0.000000
    z: 0.055  # random value
    roll: 0.000000
    pitch: 0.00000
    yaw: 0.000000
  usb_camera_front:
    x: 0.5      # 50cm forward from sensor_kit_base
    y: 0.0      # centered
    z: 0.3      # 30cm up
    roll: 0.0
    pitch: 0.0
    yaw: 0.0    # facing forward
  usb_camera_rear:
    x: -0.5     # 50cm backward from sensor_kit_base
    y: 0.0      # centered
    z: 0.3      # 30cm up
    roll: 0.0
    pitch: 0.0
    yaw: 3.14159 # facing backward (180 degrees)
  usb_camera_left:
    x: 0.0      # centered front-back
    y: 0.4      # 40cm to the left
    z: 0.3      # 30cm up
    roll: 0.0
    pitch: 0.0
    yaw: 1.5708 # facing left (90 degrees)
  usb_camera_right:
    x: 0.0      # centered front-back
    y: -0.4     # 40cm to the right
    z: 0.3      # 30cm up
    roll: 0.0
    pitch: 0.0
    yaw: -1.5708 # facing right (-90 degrees)
