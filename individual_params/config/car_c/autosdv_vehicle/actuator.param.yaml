# Car C. The MOTOR values are measured (2026-10-19, keyboard_pwm_control,
# 5-count steps); the STEERING values are still car B's, copied until car C's
# servo is measured -- do not trust them. Select with the launch argument
# vehicle_id:=car_c.
/**:
  ros__parameters:
    ## Motor, measured 2026-10-19. The ESC has a neutral BAND, 380..390, where
    # it never drives either way:
    #   - from rest, forward needs >= 400 (395 does not start the car); once
    #     moving, 395 holds it and <= 390 releases it.
    #   - after any forward drive, below 380 BRAKES, it does not reverse. To
    #     reverse: pull to 340, come back up to >= 380, then below 380 drives
    #     backward.
    #   - armed, 375, 370, ... drive backward; 380..390 stops but stays armed;
    #     only >= 400 disarms (and drives forward).
    # init_pwm is the middle of the band, 5 counts from either edge. The
    # stopping brake must stay above the arming point 340, or every stop arms
    # reverse: 375 is provisional (below the band, above 340); that it brakes
    # without arming is not tested yet.
    init_pwm: 385
    brake_pwm: 375
    forward_start_pwm: 400
    forward_hold_pwm: 390
    reverse_stop_pwm: 380
    reverse_start_pwm: 375
    reverse_arm_pwm: 340

    ## Steering: PROVISIONAL (2026-10-20), not yet measured with steer-hold /
    # steer-fit. On car C a lower PWM turns RIGHT and a higher PWM turns LEFT
    # (seen while driving). The actuator computes init_steer + angle * ratio
    # with Autoware's angle positive to the LEFT, so the ratio is POSITIVE here:
    # car B's -132, copied before, sent a right command to a higher PWM, and
    # lab2_straight_2m_1 curved 0.36 m left at full lock (-20 deg -> 445).
    # The servo has a DEAD BAND: the wheels do not move between about 385 and
    # 412 (the user sees no difference between 400 and 408; lab2_straight_2m_4
    # drove dead straight at 386-402 and only turned right near 380). Small
    # tracker corrections did nothing, the error grew, and a late large one
    # snaked the car; steer_deadband starts a command at the band's edge.
    # Car C's wheels follow the servo only while the car rolls (by design of
    # this chassis): at a standstill they keep their last angle. Centre the
    # steering and roll the car a little before a run, and measure while driving.
    # The ends are measured (2026-10-20, keyboard_pwm_control): full lock is
    # 400 -/+ 80. The 355..445 copied from car B cost a third of the lock: with
    # the dead band, the tightest turn was about R 1.3 m, and lab2_uturn_2 (R 1.1)
    # ran wide out of the turn with the command pinned at the limit.
    init_steer: 400
    min_steer: 320
    max_steer: 480
    steer_deadband: 13

    # Car B's magnitude with car C's sign: replace it with `just lab2 steer-fit`'s
    # result on car C.
    tire_angle_to_steer_ratio: 132.0
