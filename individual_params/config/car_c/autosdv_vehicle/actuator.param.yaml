# Car C. The MOTOR values are measured (2026-10-19, keyboard_pwm_control,
# 5-count steps); the STEERING values are still car B's, copied until car C's
# servo is measured -- do not trust them. Select with the launch argument
# vehicle_id:=car_c.
/**:
  ros__parameters:
    ## Motor, measured 2026-10-19. The ESC has a neutral BAND, 380..390, where
    # it never drives either way:
    #   - from rest, forward needs >= 400 (395 does not start the car); once
    #     moving, 395 holds it and <= 390 releases it.
    #   - after any forward drive, below 380 BRAKES, it does not reverse. To
    #     reverse: pull to 340, come back up to >= 380, then below 380 drives
    #     backward.
    #   - armed, 375, 370, ... drive backward; 380..390 stops but stays armed;
    #     only >= 400 disarms (and drives forward).
    # init_pwm is the middle of the band, 5 counts from either edge. The
    # stopping brake must stay above the arming point 340, or every stop arms
    # reverse: 375 is provisional (below the band, above 340); that it brakes
    # without arming is not tested yet.
    init_pwm: 385
    brake_pwm: 375
    forward_start_pwm: 400
    forward_hold_pwm: 390
    reverse_stop_pwm: 380
    reverse_start_pwm: 375
    reverse_arm_pwm: 340

    ## Steering: NOT MEASURED ON CAR C. Car B's: centre 400, +-45 counts.
    # Lower PWM (355) = RIGHT turn, higher PWM (445) = LEFT turn, as on the
    # other cars.
    init_steer: 400
    min_steer: 355
    max_steer: 445

    # Car B's rough ratio, not car C's: replace it with `just lab2 steer-fit`'s
    # result on car C.
    tire_angle_to_steer_ratio: -132.0
